{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
<div class="search-wrap">
<input type="search" id="search-input" placeholder="Search stories..." aria-label="Search stories" autocomplete="off">
<p id="search-count" class="search-count"></p>
<div id="search-results"></div>
</div>
<script>
(function() {
  var stories = [
  {{ $stories := where .Site.RegularPages "Section" "stories" }}
  {{ range $i, $s := $stories }}{{ if $i }},{{ end }}
    {"t": {{ .Title | jsonify | safeJS }}, "u": {{ .RelPermalink | jsonify | safeJS }}, "d": {{ .Date.Format "2006-01-02" | jsonify | safeJS }}, "b": {{ with .Params.beats }}{{ index . 0 | jsonify | safeJS }}{{ else }}"•"{{ end }}, "l": {{ with .Params.lede }}{{ . | jsonify | safeJS }}{{ else }}""{{ end }}}{{ end }}
  ];
  var input = document.getElementById('search-input');
  var results = document.getElementById('search-results');
  var count = document.getElementById('search-count');
  function render(q) {
    q = q.trim().toLowerCase();
    results.innerHTML = '';
    if (q.length < 2) { count.textContent = stories.length + ' stories'; return; }
    var hits = stories.filter(function(s) {
      return (s.t + ' ' + s.l).toLowerCase().indexOf(q) !== -1;
    });
    count.textContent = hits.length + ' result' + (hits.length === 1 ? '' : 's');
    hits.slice(0, 50).forEach(function(s) {
      var a = document.createElement('article');
      a.className = 'river-item';
      a.innerHTML = '<div class="kicker">' + s.b + ' · ' + s.d + '</div>' +
        '<h3><a href="' + s.u + '">' + s.t.replace(/</g, '&lt;') + '</a></h3>' +
        (s.l ? '<p>' + s.l.replace(/</g, '&lt;') + '</p>' : '');
      results.appendChild(a);
    });
  }
  input.addEventListener('input', function() { render(input.value); });
  render('');
})();
</script>
{{ end }}
