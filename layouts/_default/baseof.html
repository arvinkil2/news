<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Params.lede }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="{{ "/" | relURL }}">Kilambi News</a>
    <nav class="nav">
      <a href="{{ "/" | relURL }}">Today</a>
      <a href="{{ "/beats/commodities/" | relURL }}">Commodities</a>
      <a href="{{ "/beats/infra-deals/" | relURL }}">Infra Deals</a>
      <a href="{{ "/beats/politics/" | relURL }}">Politics</a>
      <a href="{{ "/beats/rates/" | relURL }}">Rates</a>
      <a href="{{ "/briefings/" | relURL }}">Archive</a>
      <a href="{{ "/stories/" | relURL }}">Developing</a>
    </nav>
  </div>
</header>
<main class="content">
{{ block "main" . }}{{ end }}
</main>
<footer class="footer">
  <div class="footer-inner">
    <p>Kilambi News is a personal briefing. Content is AI-generated from public sources; verify before acting on it.</p>
    <p><a href="{{ "/briefings/" | relURL }}">Archive</a></p>
  </div>
</footer>
</body>
</html>
