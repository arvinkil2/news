baseURL = "https://news.kilambi.com/"
title = "Kilambi News"
languageCode = "en"

[taxonomies]
  beat = "beats"
  region = "regions"
  tag = "tags"

[params]
  description = "A personal daily briefing: commodities, mining, infrastructure, politics, rates, technology, and life sciences."
  beat_order = ["commodities", "mining", "infra-deals", "politics", "rates", "technology", "life-sciences"]
  region_order = ["global", "north-america", "latin-america", "europe", "middle-east", "africa", "asia-pacific"]

  [params.beat_names]
    commodities = "Commodities"
    mining = "Mining"
    infra-deals = "Infrastructure"
    politics = "Politics"
    rates = "Rates"
    technology = "Technology"
    life-sciences = "Life Sciences"

  [params.region_names]
    global = "Global"
    north-america = "North America"
    latin-america = "Latin America"
    europe = "Europe"
    middle-east = "Middle East"
    africa = "Africa"
    asia-pacific = "Asia-Pacific"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      strikethrough = false
