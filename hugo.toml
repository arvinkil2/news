baseURL = "https://news.kilambi.com/"
title = "Kilambi News"
languageCode = "en"

[taxonomies]
  beat = "beats"
  tag = "tags"

[params]
  description = "A personal daily briefing: commodities, infrastructure, politics, and rates."

  [params.beat_names]
    commodities = "Commodities"
    infra-deals = "Infrastructure"
    politics = "Politics"
    rates = "Rates"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      strikethrough = false
