baseURL = "https://news.kilambi.com/"
title = "Kilambi News"
languageCode = "en"

[taxonomies]
  beat = "beats"
  tag = "tags"

[params]
  description = "A personal daily briefing: commodities, mining, infrastructure, politics, and rates."
  beat_order = ["commodities", "mining", "infra-deals", "politics", "rates"]

  [params.beat_names]
    commodities = "Commodities"
    mining = "Mining"
    infra-deals = "Infrastructure"
    politics = "Politics"
    rates = "Rates"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      strikethrough = false
